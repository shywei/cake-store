<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="description" content="小胖私家烘焙 - 进口动物奶油，纯手工制作，来图定制。从奶油蛋糕到甜品台，每一份都用心手作">

<title>小胖私家烘焙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --green: #7A9E7E;
  --green-light: #E8F0E6;
  --green-dark: #5A7E5E;
  --cream: #FDF8F2;
  --cream-dark: #F5EDE0;
  --blush: #F0D0C8;
  --blush-light: #F8E8E4;
  --coral: #E8A090;
  --brown: #8B7355;
  --brown-light: #C4B59B;
  --text: #3D3D3D;
  --text-light: #8A8A8A;
  --text-lighter: #B5B5B5;
  --white: #FFFFFF;
  --shadow: 0 4px 20px rgba(122, 158, 126, 0.1);
  --shadow-hover: 0 8px 32px rgba(122, 158, 126, 0.18);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--cream);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

img { display: block; max-width: 100%; }

a { text-decoration: none; color: inherit; }

/* Navigation */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(253, 248, 242, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(122, 158, 126, 0.1);
}

.nav-inner {
  max-width: 480px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-brand-icon {
  width: 32px;
  height: 32px;
  background: var(--green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: white;
}

.nav-brand-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--green-dark);
  letter-spacing: 2px;
}

.nav-admin {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--brown-light);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brown);
  font-size: 16px;
  transition: var(--transition);
}

.nav-admin:active { background: var(--cream-dark); }

/* Hero */
.hero {
  padding: 100px 20px 48px;
  text-align: center;
  max-width: 480px;
  margin: 0 auto;
}

.hero-subtitle {
  display: inline-block;
  font-size: 12px;
  color: var(--green);
  background: var(--green-light);
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 2px;
  margin-bottom: 16px;
  font-weight: 500;
}

.hero-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--green-dark);
  letter-spacing: 4px;
  line-height: 1.3;
  margin-bottom: 12px;
}

.hero-desc {
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.8;
  max-width: 320px;
  margin: 0 auto;
  font-weight: 300;
}

.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 8px 0 20px;
}

.divider-line {
  width: 40px;
  height: 1px;
  background: var(--brown-light);
  opacity: 0.5;
}

.divider-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--blush);
}

/* Categories */
.categories {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px 24px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar { display: none; }

.categories-inner {
  display: flex;
  gap: 10px;
  padding-bottom: 4px;
}

.cat-btn {
  flex-shrink: 0;
  padding: 8px 20px;
  border: 1.5px solid var(--cream-dark);
  border-radius: 24px;
  background: var(--white);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  white-space: nowrap;
}

.cat-btn:active { transform: scale(0.96); }

.cat-btn.active {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

/* Cake Grid */
.cake-grid {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px 100px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* Cake Card */
.cake-card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: var(--transition);
  cursor: pointer;
  animation: fadeUp 0.5s ease both;
}

.cake-card:nth-child(2n) { animation-delay: 0.1s; }
.cake-card:nth-child(3n) { animation-delay: 0.2s; }
.cake-card:nth-child(4n) { animation-delay: 0.15s; }

.cake-card:active { transform: scale(0.98); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.cake-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: var(--cream-dark);
}

.cake-img-wrap.loading {
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.cake-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.cake-card:hover .cake-img { transform: scale(1.05); }

.cake-img-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: var(--text-lighter);
  background: linear-gradient(135deg, var(--cream-dark), var(--green-light));
}

.cake-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 500;
  color: white;
  background: var(--coral);
}

.cake-offer {
  position: absolute;
  bottom: 8px;
  right: 8px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #e74c3c, #e67e22);
  box-shadow: 0 2px 6px rgba(231, 76, 60, 0.35);
}

.cake-info {
  padding: 12px 14px 14px;
}

.cake-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.4;
}

.cake-desc {
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
  font-weight: 300;
}

.cake-price {
  font-size: 17px;
  font-weight: 700;
  color: var(--coral);
  letter-spacing: 0.5px;
}

.cake-price-unit {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-lighter);
}

.cake-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

.cake-tag {
  font-size: 10px;
  color: var(--green);
  background: var(--green-light);
  padding: 2px 8px;
  border-radius: 8px;
}

/* Empty state */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-lighter);
}

.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state-text { font-size: 14px; }

/* Error state */
.error-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
}

.error-state-icon { font-size: 48px; margin-bottom: 12px; }
.error-state-text { font-size: 14px; color: var(--text-light); margin-bottom: 12px; }

.error-retry {
  padding: 10px 24px;
  border: 1.5px solid var(--green);
  border-radius: 24px;
  background: var(--white);
  color: var(--green);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}

.error-retry:active { background: var(--green-light); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.open { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--white);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px 20px 32px;
  animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--cream-dark);
  border-radius: 4px;
  margin: 0 auto 16px;
}

/* Carousel */
.modal-carousel {
  position: relative;
  width: 100%;
  aspect-ratio: 16/10;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--cream-dark);
  margin-bottom: 12px;
}

.modal-carousel-track {
  display: flex;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.modal-carousel-track::-webkit-scrollbar { display: none; }

.modal-carousel-slide {
  flex: 0 0 100%;
  height: 100%;
  scroll-snap-align: start;
}

.modal-carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.modal-carousel-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 12px;
}

.modal-carousel-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cream-dark);
  border: none;
  padding: 0;
  cursor: pointer;
  transition: var(--transition);
}

.modal-carousel-dot.active {
  background: var(--green);
  width: 18px;
  border-radius: 3px;
}

.modal-carousel-count {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.45);
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
  pointer-events: none;
}

.modal-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.modal-price {
  font-size: 24px;
  font-weight: 700;
  color: var(--coral);
  margin-bottom: 12px;
}

.modal-price-unit { font-size: 14px; color: var(--text-lighter); font-weight: 400; }

.modal-desc {
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.8;
  margin-bottom: 20px;
  font-weight: 300;
}

.modal-contact {
  background: var(--green-light);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: center;
}

.modal-contact-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--green-dark);
  margin-bottom: 8px;
}

.modal-contact-wechat {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 500;
  color: var(--green-dark);
}

.modal-close {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  border: 1.5px solid var(--cream-dark);
  border-radius: var(--radius-sm);
  background: var(--white);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.modal-close:active { background: var(--cream-dark); }

/* Footer */
.footer {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px 40px;
  text-align: center;
}

.footer-divider {
  width: 60px;
  height: 1px;
  background: var(--brown-light);
  opacity: 0.3;
  margin: 0 auto 20px;
}

.footer-text {
  font-size: 12px;
  color: var(--text-lighter);
  line-height: 2;
  font-weight: 300;
}

.footer-contact {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--green);
  font-weight: 500;
  font-size: 13px;
  margin-top: 8px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  background: var(--text);
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  opacity: 0;
  transition: 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show { opacity: 1; }

/* Loading spinner */
.grid-loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-lighter);
  font-size: 14px;
}

.grid-loading::after {
  content: '';
  display: block;
  width: 28px;
  height: 28px;
  margin: 12px auto 0;
  border: 3px solid var(--cream-dark);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (min-width: 480px) {
  .cake-grid { gap: 20px; }
  .hero-title { font-size: 36px; }
}

@media (min-width: 640px) {
  .cake-grid { grid-template-columns: repeat(3, 1fr); max-width: 640px; }
  .hero, .categories, .nav-inner { max-width: 640px; }
}

@media (min-width: 1024px) {
  .cake-grid { grid-template-columns: repeat(4, 1fr); max-width: 900px; gap: 24px; }
  .hero, .categories, .nav-inner { max-width: 900px; }
  .hero { padding-top: 120px; }
  .hero-title { font-size: 42px; }
}
</style>
</head>

<script>
// ============================================================
// 配置 - 部署前替换为你的 Supabase 项目信息
// ============================================================
var SUPABASE_URL = 'https://qcqobpckzceysdxyaryu.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_NmfkvrcpFSQuLjqB4Gbsng_Mp0sEcqL';

// ============================================================
// 浏览器检测 —— 仅支持微信内和手机浏览器，阻止 PC 端访问
// ============================================================
var ua = navigator.userAgent.toLowerCase();
var isWechat = ua.indexOf('micromessenger') !== -1;
var isMobile = /android|iphone|ipad|ipod|phone|mobile|blackberry|iemobile|opera mini|webos/i.test(ua);
var isPc = (!isMobile && !isWechat);

if (isPc) {
  document.body.innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:#FDF8F2;color:#3D3D3D;font-family:sans-serif;text-align:center;">' +
    '<div style="font-size:64px;margin-bottom:16px;">📱</div>' +
    '<h1 style="font-size:20px;font-weight:600;margin-bottom:8px;">请在手机上打开</h1>' +
    '<p style="font-size:14px;color:#8A8A8A;line-height:1.8;max-width:280px;">请用微信或手机浏览器扫描二维码访问本页面</p>' +
    '</div>';
  throw new Error('PC browser not allowed');
}

// ============================================================

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var grid = document.getElementById('cakeGrid');
var categoryList = document.getElementById('categoryList');
var modalOverlay = document.getElementById('modalOverlay');
var toast = document.getElementById('toast');
var currentCategory = '全部';

async function loadCakes() {
  var result = await sb.from('cakes').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true });
  if (result.error) {
    console.error('加载蛋糕失败:', result.error);
    return null;
  }
  return result.data || [];
}

function getCakeImages(cake) {
  if (cake.images && cake.images.length > 0) return cake.images;
  if (cake.image_url) return [cake.image_url];
  return [];
}

function formatPrice(price) {
  if (!price || price <= 0) return '';
  return '¥' + price;
}

var TAB_CONFIG = [
  { id: 'promoted', label: '🏆 当季主推' },
  { id: '奶油蛋糕', label: '🎂 奶油蛋糕' },
  { id: '甜点下午茶', label: '🍪 甜点下午茶' },
  { id: '宴会甜品', label: '🎉 宴会甜品' }
];

function renderCategories() {
  categoryList.innerHTML = TAB_CONFIG.map(function (tab) {
    return '<button class="cat-btn ' + (tab.id === currentCategory ? 'active' : '') + '" data-cat="' + tab.id + '">' + tab.label + '</button>';
  }).join('');

  Array.from(document.querySelectorAll('.cat-btn')).forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.cat-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentCategory = btn.getAttribute('data-cat');
      renderCakes();
    });
  });
}

function renderCakes(cakes) {
  if (cakes === undefined) {
    loadCakes().then(function (data) {
      if (data === null) { renderCakes(null); return; }
      renderCakes(data);
    });
    return;
  }

  if (cakes === null) {
    grid.innerHTML =
      '<div class="error-state">' +
      '<div class="error-state-icon">😅</div>' +
      '<p class="error-state-text">网络开小差了，请稍后重试</p>' +
      '<button class="error-retry" onclick="renderCakes()">重新加载</button>' +
      '</div>';
    return;
  }

  var filtered = cakes.filter(function (c) {
    if (currentCategory === 'promoted') return c.promoted === true;
    return c.category === currentCategory;
  });

  if (filtered.length === 0) {
    grid.innerHTML =
      '<div class="empty-state">' +
      '<div class="empty-state-icon">🍰</div>' +
      '<p class="empty-state-text">暂无蛋糕，敬请期待～</p>' +
      '</div>';
    return;
  }

  window._cakes = filtered;
  var total = filtered.length;

  grid.innerHTML = filtered.map(function (cake, i) {
    var images = getCakeImages(cake);
    var eager = i < 6 || total <= 6;
    var hasImg = images.length > 0;
    var firstImg = hasImg ? images[0] : '';
    return '<div class="cake-card" data-index="' + i + '">' +
      '<div class="cake-img-wrap">' +
      (hasImg
        ? (eager
          ? '<img class="cake-img" src="' + firstImg + '" alt="' + cake.name + '">'
          : '<img class="cake-img lazy" data-src="' + firstImg + '" alt="' + cake.name + '">')
        : '<div class="cake-img-placeholder">🎂</div>') +
      (cake.badge ? '<span class="cake-badge">' + cake.badge + '</span>' : '') +
      (cake.subcategory ? '<span class="cake-offer">🔥 限时特惠</span>' : '') +
      '</div>' +
      '<div class="cake-info">' +
      '<div class="cake-name">' + cake.name + '</div>' +
      '<div class="cake-desc">' + (cake.description || '') + '</div>' +
      '<div class="cake-meta">' +
      '<span class="cake-price">' + formatPrice(cake.price) + '</span>' +
      (cake.category ? '<span class="cake-tag">' + cake.category + '</span>' : '') +
      '</div>' +
      '</div>' +
      '</div>';
  }).join('');

  Array.from(document.querySelectorAll('.cake-img:not(.lazy)')).forEach(function (img) {
    img.onerror = function () { this.outerHTML = '<div class="cake-img-placeholder">🎂</div>'; };
  });

  var lazyImgs = document.querySelectorAll('.cake-img.lazy');
  if (lazyImgs.length > 0) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          var img = entry.target;
          var wrap = img.parentElement;
          wrap.classList.add('loading');
          img.src = img.getAttribute('data-src');
          img.classList.remove('lazy');
          img.onload = function () { wrap.classList.remove('loading'); };
          img.onerror = function () { wrap.classList.remove('loading'); this.outerHTML = '<div class="cake-img-placeholder">🎂</div>'; };
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '400px' });
    lazyImgs.forEach(function (img) { observer.observe(img); });
  }

  Array.from(document.querySelectorAll('.cake-card')).forEach(function (card) {
    card.addEventListener('click', function () {
      var idx = parseInt(card.getAttribute('data-index'));
      if (window._cakes[idx]) showModal(window._cakes[idx]);
    });
  });
}

function showModal(cake) {
  var images = getCakeImages(cake);
  var track = document.getElementById('carouselTrack');
  var dots = document.getElementById('carouselDots');
  var count = document.getElementById('carouselCount');

  track.innerHTML = images.map(function (url) {
    return '<div class="modal-carousel-slide"><img src="' + url + '" alt="' + cake.name + '" onerror="this.alt=\'🎂\'"></div>';
  }).join('') || '<div class="modal-carousel-slide" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-lighter)">🎂</div>';

  if (images.length > 1) {
    dots.innerHTML = images.map(function (_, i) {
      return '<button class="modal-carousel-dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '"></button>';
    }).join('');

    count.textContent = '1/' + images.length;
    count.style.display = 'block';

    Array.from(dots.children).forEach(function (dot) {
      dot.addEventListener('click', function () {
        var idx = parseInt(this.getAttribute('data-index'));
        track.children[idx].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
      });
    });

    track.onscroll = function () {
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      Array.from(dots.children).forEach(function (d, i) {
        d.classList.toggle('active', i === idx);
      });
      count.textContent = (idx + 1) + '/' + images.length;
    };
  } else {
    dots.innerHTML = '';
    count.style.display = 'none';
    track.onscroll = null;
  }

  document.getElementById('modalName').textContent = cake.name;
  document.getElementById('modalPrice').innerHTML = formatPrice(cake.price);
  document.getElementById('modalDesc').textContent = cake.description || '';
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function hideModal() {
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalOverlay.addEventListener('click', function (e) {
  if (e.target === modalOverlay) hideModal();
});
document.getElementById('modalClose').addEventListener('click', hideModal);

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
}

// Init
currentCategory = 'promoted';
renderCategories();
loadCakes().then(function (cakes) {
  renderCakes(cakes);
});
</script>
</body>
</html>
